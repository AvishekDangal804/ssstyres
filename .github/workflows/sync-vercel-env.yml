name: Sync Resend secrets to Vercel

# Manual button in the Actions tab, not run on every push — this only needs
# to run again if one of the secret values below actually changes.
on:
  workflow_dispatch:

jobs:
  sync-env:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Push env vars to Vercel (Production) and redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_TO_EMAIL: ${{ secrets.LEAD_TO_EMAIL }}
          LEAD_FROM_EMAIL: ${{ secrets.LEAD_FROM_EMAIL }}
        run: |
          set_env () {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              echo "::error::GitHub secret $name is empty or missing — add it under repo Settings > Secrets > Actions."
              exit 1
            fi
            vercel env rm "$name" production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | vercel env add "$name" production --token="$VERCEL_TOKEN"
          }
          set_env RESEND_API_KEY "$RESEND_API_KEY"
          set_env LEAD_TO_EMAIL "$LEAD_TO_EMAIL"
          set_env LEAD_FROM_EMAIL "$LEAD_FROM_EMAIL"

          # Existing deployments don't pick up new env vars retroactively,
          # so trigger a fresh production deploy with the values just set.
          vercel deploy --prod --token="$VERCEL_TOKEN"
