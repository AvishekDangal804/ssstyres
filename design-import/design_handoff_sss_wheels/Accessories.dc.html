<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>body{margin:0;background:#fff;color:#161616;font-family:Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#161616;text-decoration:none}a:hover{color:#D80009}</style>
</helmet>
<div data-screen-label="Accessories" style="min-height:100vh;display:flex;flex-direction:column">
  <dc-import name="SiteHeader" hint-size="100%,110px" style="position:sticky;top:0;z-index:50"></dc-import>
  <section style="background:#0A0A0A;color:#fff;position:relative;overflow:hidden">
    <div style="position:absolute;right:-40px;top:-60px;width:220px;height:140%;background:#D80009;transform:skewX(-18deg);pointer-events:none"></div>
    <div style="max-width:min(1600px,94vw);margin:0 auto;padding:clamp(39px,4.3vw,76px) clamp(20px,3vw,56px);position:relative;width:100%;box-sizing:border-box">
      <div style="font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#BDBDBD;margin-bottom:10px">Accessories</div>
      <h1 style="font-family:Barlow,sans-serif;font-weight:800;font-size:clamp(40px,6vw,64px);line-height:.95;text-transform:uppercase;margin:0 0 14px">Everything that bolts on with the wheel</h1>
      <p style="font-size:17px;line-height:1.6;color:#CFCFCF;max-width:620px;margin:0">Nuts, locks, caps and hardware — stocked alongside the wheels so your order arrives fit-ready.</p>
    </div>
  </section>
  <section style="max-width:min(1600px,94vw);margin:0 auto;padding:clamp(34px,3.7vw,65px) clamp(20px,3vw,56px) clamp(67px,7.4vw,130px);width:100%;box-sizing:border-box;flex:1">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px">
      <sc-for list="{{ items }}" as="a" hint-placeholder-count="6">
        <div style="border:1px solid #E4E4E4;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s" style-hover="border-color:#D80009;box-shadow:0 14px 34px rgba(0,0,0,.1)">
          <div style="position:relative;aspect-ratio:4/3;background:#F7F7F7;overflow:hidden"><image-slot id="acc-{{ a.id }}" shape="rect" fit="contain" placeholder="{{ a.name }} photo"></image-slot></div>
          <div style="padding:18px 20px"><div style="font-family:Barlow,sans-serif;font-weight:800;font-size:24px;line-height:1;text-transform:uppercase;margin-bottom:8px">{{ a.name }}</div><p style="font-size:14px;line-height:1.6;color:#5F5F5F;margin:0">{{ a.desc }}</p></div>
        </div>
      </sc-for>
    </div>
    <div style="margin-top:36px;background:#F5F5F5;padding:24px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap">
      <div style="font-size:15px;color:#444;max-width:640px">Accessories are ordered alongside wheels through the dealer portal, or by phone for one-off requirements.</div>
      <a href="http://orders.ssswheels.com.au/WebOrder" target="_blank" style="display:inline-flex;align-items:center;background:#D80009;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.07em;text-transform:uppercase;padding:0 22px;height:46px;border-radius:999px" style-hover="background:#A80007;color:#fff">Order via portal</a>
    </div>
  </section>
  <dc-import name="SiteFooter" hint-size="100%,480px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { id: 'nuts', name: 'Wheel nuts & studs', desc: 'Tapered, shank and mag-seat nuts in chrome and black, matched to every SSS fitment.' },
      { id: 'locks', name: 'Lock nut sets', desc: 'Keyed lock nuts to keep the set on the car — one key per vehicle, spares available.' },
      { id: 'caps', name: 'Centre caps', desc: 'Replacement SSS centre caps in gloss and matte black, all bore sizes.' },
      { id: 'rings', name: 'Hub-centric rings', desc: 'Precision rings for a vibration-free fit on every PCD and bore combination.' },
      { id: 'valves', name: 'Valves & TPMS', desc: 'Rubber and alloy valve stems plus TPMS-compatible hardware for late-model vehicles.' },
      { id: 'hardware', name: 'Beadlock hardware', desc: 'Replacement rings, bolts and torque specs for SSS beadlock wheels.' }
    ] };
  }
}
</script>
</body>
</html>
